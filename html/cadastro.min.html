<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projeto ReConecta - Cadastro</title><link rel="stylesheet" href="../css/style.css"></head><body><header><h1>Projeto ReConecta</h1><nav><a href="index.html">Início</a> <a href="projetos.html">Projetos</a> <a href="cadastro.html">Cadastro</a></nav></header><main><h2>Cadastro de apoiador</h2><form id="form-cadastro"><fieldset><legend>Dados pessoais</legend><label for="nome">Nome completo:</label> <input type="text" id="nome" name="nome" required> <label for="email">E-mail:</label> <input type="email" id="email" name="email" required> <label for="nascimento">Data de nascimento:</label> <input type="date" id="nascimento" name="nascimento" required> <label for="cpf">CPF:</label> <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required> <label for="telefone">Telefone:</label> <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required></fieldset><fieldset><legend>Endereço</legend><label for="cep">CEP:</label> <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" required> <label for="endereco">Endereço:</label> <input type="text" id="endereco" name="endereco" required></fieldset><button type="submit">Enviar cadastro</button></form></main><footer><p>Projeto ReConecta - Inclusão Digital</p></footer><script type="module" src="../js/script.js"></script></body></html>
